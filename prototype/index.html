<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CoinBattleSaki — Prototype</title>
<style>
  :root {
    --bg: #0a0a1a;
    --panel-bg: #111128;
    --text: #e0e0e0;
    --gold: #ffd700;
    --red: #ff2244;
    --green: #22cc88;
    --blue: #4488ff;
    --purple: #9944ff;

    /* Active bot color (default: SARAH green) */
    --bot-color: #22cc88;
    --bot-glow: rgba(34, 204, 136, 0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, 'Helvetica Neue', 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 430px;
    height: 100dvh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* === Screen Edge Glow === */
  .edge-glow {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  .edge-glow.gold {
    border: 2px solid rgba(255, 215, 0, 0.6);
    box-shadow: inset 0 0 60px rgba(255, 215, 0, 0.2), 0 0 30px rgba(255, 215, 0, 0.1);
  }
  .edge-glow.red {
    border: 2px solid rgba(255, 34, 68, 0.6);
    box-shadow: inset 0 0 60px rgba(255, 34, 68, 0.2), 0 0 30px rgba(255, 34, 68, 0.1);
  }
  .edge-glow.rainbow {
    border: 2px solid transparent;
    background: linear-gradient(var(--bg), var(--bg)) padding-box,
                linear-gradient(45deg, #ff0000, #ff8800, #ffff00, #00ff00, #0088ff, #8800ff, #ff0000) border-box;
    box-shadow: inset 0 0 60px rgba(255, 255, 255, 0.1);
    animation: rainbow-rotate 2s linear infinite;
  }
  @keyframes rainbow-rotate {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(360deg); }
  }

  /* === Header === */
  .header {
    height: 48px;
    background: linear-gradient(180deg, #0f1530, #0a0a1a);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    font-size: 13px;
    flex-shrink: 0;
    border-bottom: 1px solid #1a1a3a;
    z-index: 10;
    transition: all 0.5s ease;
  }
  .header .pair { font-weight: bold; font-size: 15px; letter-spacing: 0.5px; }
  .header .price-info { text-align: right; }
  .header .price { font-size: 16px; font-weight: bold; font-variant-numeric: tabular-nums; }
  .header .change { font-size: 11px; }
  .header .badge {
    display: none;
    padding: 3px 10px;
    border-radius: 4px;
    font-weight: bold;
    font-size: 11px;
    animation: pulse 0.8s infinite;
    letter-spacing: 1px;
  }

  /* === Chart Area === */
  .chart-area {
    flex: 1;
    background: var(--bg);
    position: relative;
    overflow: hidden;
    min-height: 0;
  }

  /* Grid lines */
  .chart-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* Candlesticks */
  .candles {
    position: absolute;
    bottom: 25%;
    left: 5%;
    right: 5%;
    height: 50%;
    display: flex;
    align-items: flex-end;
    gap: 3px;
    justify-content: flex-end;
  }
  .candle {
    width: 10px;
    position: relative;
    opacity: 0.9;
  }
  .candle .wick {
    width: 1.5px;
    margin: 0 auto;
    border-radius: 1px;
  }
  .candle .body {
    width: 100%;
    border-radius: 1.5px;
    min-height: 2px;
  }
  .candle.g .body { background: var(--green); }
  .candle.g .wick { background: var(--green); }
  .candle.r .body { background: var(--red); }
  .candle.r .wick { background: var(--red); }

  /* TP/SL Lines */
  .chart-line {
    position: absolute;
    left: 0; right: 0;
    height: 1px;
    opacity: 0;
    transition: opacity 0.6s ease;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 8px;
  }
  .chart-line span {
    font-size: 10px;
    font-weight: bold;
    padding: 1px 6px;
    border-radius: 2px;
    font-variant-numeric: tabular-nums;
  }
  .tp-line {
    top: 12%;
    background: var(--gold);
    box-shadow: 0 0 12px rgba(255,215,0,0.3);
  }
  .tp-line span { background: rgba(255,215,0,0.15); color: var(--gold); }
  .sl-line {
    top: 68%;
    background: var(--red);
    box-shadow: 0 0 12px rgba(255,34,68,0.3);
  }
  .sl-line span { background: rgba(255,34,68,0.15); color: var(--red); }
  .entry-line {
    top: 40%;
    border-top: 1px dashed rgba(255,255,255,0.3);
    background: none;
  }
  .entry-line span { color: #888; font-size: 9px; }

  /* Zones */
  .zone {
    position: absolute;
    left: 0; right: 0;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  .zone-tp {
    top: 12%;
    height: 28%;
    background: linear-gradient(to bottom, rgba(34,204,136,0.06), transparent);
  }
  .zone-sl {
    top: 40%;
    height: 28%;
    background: linear-gradient(to top, rgba(255,34,68,0.06), transparent);
  }

  /* Beast overlay in chart (尾獣メカニクス) */
  .beast-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.8s ease, transform 0.8s ease;
    z-index: 1;
    overflow: hidden;
  }
  .beast-overlay img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 20%;
    mask-image: radial-gradient(ellipse 80% 80% at center, black 30%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse 80% 80% at center, black 30%, transparent 70%);
  }
  .beast-overlay.phase-idle { opacity: 0; }
  .beast-overlay.phase-battle { opacity: 0.15; }
  .beast-overlay.phase-hot { opacity: 0.3; filter: saturate(1.5); }
  .beast-overlay.phase-awaken { opacity: 0.5; filter: saturate(2) brightness(1.3); }
  .beast-overlay.phase-fizzle { opacity: 0.08; filter: grayscale(0.8); }

  /* Distance label */
  .distance {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 16px;
    font-weight: bold;
    opacity: 0;
    transition: all 0.5s ease;
    text-shadow: 0 0 20px currentColor;
    white-space: nowrap;
  }

  /* PnL box */
  .pnl-box {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8);
    border: 1px solid #333;
    border-radius: 8px;
    padding: 5px 14px;
    font-size: 13px;
    font-weight: bold;
    opacity: 0;
    transition: all 0.5s ease;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    backdrop-filter: blur(8px);
  }

  /* State label (big center text) */
  .state-label {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 28px;
    font-weight: 900;
    opacity: 0;
    transition: all 0.4s ease;
    text-shadow: 0 0 30px currentColor;
    letter-spacing: 4px;
    pointer-events: none;
  }

  /* Particles */
  .particles-container {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .particle {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    opacity: 0;
  }

  /* === Bot Panel === */
  .bot-panel {
    height: 180px;
    background: var(--panel-bg);
    display: flex;
    padding: 10px;
    gap: 10px;
    border-top: 1px solid #1a1a3a;
    flex-shrink: 0;
    transition: all 0.5s ease;
    overflow: hidden;
  }

  .bot-portrait {
    width: 100px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .bot-portrait .avatar {
    width: 80px;
    height: 80px;
    border-radius: 12px;
    border: 2px solid var(--bot-color);
    overflow: hidden;
    background: #1a1a2e;
    box-shadow: 0 0 15px var(--bot-glow);
    transition: all 0.5s ease;
    position: relative;
  }
  .bot-portrait .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
  }
  /* Fallback when no image */
  .bot-portrait .avatar .fallback {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    background: linear-gradient(135deg, #1a1a2e, #2a2a4e);
  }
  .bot-portrait .name {
    font-size: 12px;
    font-weight: bold;
    color: var(--bot-color);
    letter-spacing: 1px;
  }
  .bot-portrait .emotion {
    font-size: 10px;
    color: #888;
    transition: all 0.3s ease;
  }

  .bot-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 0;
  }
  .bot-info .thought {
    font-size: 12px;
    color: #bbb;
    line-height: 1.5;
    min-height: 36px;
    white-space: pre-line;
  }

  /* Indicators */
  .indicators { display: flex; flex-direction: column; gap: 3px; }
  .ind-row {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
  }
  .ind-row .lbl { width: 32px; color: #666; }
  .ind-row .bar {
    flex: 1;
    height: 5px;
    background: #1a1a2e;
    border-radius: 3px;
    overflow: hidden;
  }
  .ind-row .bar .fill {
    height: 100%;
    border-radius: 3px;
    transition: all 0.5s ease;
  }
  .ind-row .val { width: 28px; text-align: right; color: #666; font-size: 9px; font-variant-numeric: tabular-nums; }

  /* Composite */
  .composite {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 3px;
  }
  .composite .icon { font-size: 11px; color: #666; }
  .composite .bar {
    flex: 1;
    height: 8px;
    background: #1a1a2e;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid #2a2a4a;
  }
  .composite .bar .fill {
    height: 100%;
    border-radius: 3px;
    transition: all 0.6s ease;
    background: #333;
  }
  .composite .pct {
    font-size: 12px;
    font-weight: bold;
    min-width: 36px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  /* TP Progress */
  .tp-progress {
    display: flex;
    align-items: center;
    gap: 6px;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .tp-progress .lbl { font-size: 9px; color: var(--gold); width: 44px; }
  .tp-progress .bar {
    flex: 1;
    height: 6px;
    background: #1a1a2e;
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid #333;
  }
  .tp-progress .bar .fill {
    height: 100%;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--green), var(--gold));
    transition: width 0.5s ease;
  }

  /* === Bot Switcher === */
  .bot-switcher {
    height: 52px;
    background: #080818;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 8px;
    flex-shrink: 0;
    border-top: 1px solid #1a1a3a;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .bot-switcher::-webkit-scrollbar { display: none; }
  .bot-switcher button {
    background: #111128;
    border: 1.5px solid #2a2a4a;
    color: #888;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.25s ease;
    white-space: nowrap;
  }
  .bot-switcher button:hover { background: #1a1a3a; color: #ccc; }
  .bot-switcher button.active {
    background: rgba(34,204,136,0.1);
    border-color: var(--bot-color);
    color: var(--bot-color);
    font-weight: bold;
  }

  /* === Debug Bar === */
  .debug-bar {
    height: 46px;
    background: #050510;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 0 4px;
    flex-shrink: 0;
    border-top: 1px solid #1a1a3a;
  }
  .debug-bar button {
    background: #0a0a1a;
    border: 1px solid #2a2a4a;
    color: #666;
    padding: 5px 7px;
    border-radius: 4px;
    font-size: 9px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .debug-bar button:hover { background: #1a1a3a; color: #fff; }
  .debug-bar button.active { background: #1a1a3a; color: #fff; border-color: var(--blue); }

  /* === Overlay (Win/Lose) === */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    z-index: 50;
    transition: opacity 0.6s ease;
    pointer-events: none;
    backdrop-filter: blur(4px);
  }
  .overlay .bg {
    position: absolute;
    inset: 0;
  }
  .overlay .content {
    position: relative;
    z-index: 1;
    text-align: center;
  }
  .overlay .result-icon { font-size: 56px; margin-bottom: 8px; }
  .overlay .result-title { font-size: 36px; font-weight: 900; letter-spacing: 8px; }
  .overlay .result-char {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    overflow: hidden;
    margin: 16px auto;
    border: 3px solid var(--bot-color);
    box-shadow: 0 0 30px var(--bot-glow);
  }
  .overlay .result-char img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .overlay .result-name { font-size: 16px; margin-bottom: 12px; color: #ccc; }
  .overlay .result-pnl { font-size: 36px; font-weight: 900; }

  /* === Animations === */
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-4px) rotate(-0.5deg); }
    40% { transform: translateX(4px) rotate(0.5deg); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(3px); }
  }
  @keyframes float-up {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-80px) scale(0); opacity: 0; }
  }
  @keyframes entry-flash {
    0% { opacity: 0; transform: scale(1.5); }
    50% { opacity: 1; }
    100% { opacity: 0; transform: scale(2); }
  }
</style>
</head>
<body>

  <!-- Edge glow effects -->
  <div class="edge-glow" id="edge-glow"></div>

  <!-- Header -->
  <div class="header" id="header">
    <div>
      <span class="pair">BTC/USDT</span>
      <span class="badge" id="badge"></span>
    </div>
    <div class="price-info">
      <div class="price" id="price">$97,432.50</div>
      <div class="change" id="change" style="color:#22cc88">+0.1%</div>
    </div>
  </div>

  <!-- Chart Area -->
  <div class="chart-area" id="chart-area">
    <div class="chart-grid"></div>

    <!-- Zones -->
    <div class="zone zone-tp" id="zone-tp"></div>
    <div class="zone zone-sl" id="zone-sl"></div>

    <!-- Lines -->
    <div class="chart-line tp-line" id="tp-line"><span>TP $98,500 +0.71%</span></div>
    <div class="chart-line entry-line" id="entry-line"><span>Entry $97,810</span></div>
    <div class="chart-line sl-line" id="sl-line"><span>SL $97,200 -0.62%</span></div>

    <!-- Candles -->
    <div class="candles" id="candles"></div>

    <!-- Beast overlay (尾獣メカニクス — chart背景に神獣表示) -->
    <div class="beast-overlay" id="beast-overlay">
      <img id="beast-img" src="" />
    </div>

    <!-- Particles -->
    <div class="particles-container" id="particles"></div>

    <!-- Distance label -->
    <div class="distance" id="distance"></div>

    <!-- State label -->
    <div class="state-label" id="state-label"></div>

    <!-- PnL box -->
    <div class="pnl-box" id="pnl-box"></div>
  </div>

  <!-- Bot Panel -->
  <div class="bot-panel" id="bot-panel">
    <div class="bot-portrait">
      <div class="avatar" id="bot-avatar">
        <img id="bot-img" src="assets/images/sarah.png" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
        <div class="fallback" id="bot-fallback" style="display:none">🟢</div>
      </div>
      <div class="name" id="bot-name">SARAH 🟢</div>
      <div class="emotion" id="bot-emotion">calm</div>
    </div>
    <div class="bot-info">
      <div class="thought" id="bot-thought">RSIが中立帯...待機中。</div>
      <div class="indicators" id="indicators">
        <div class="ind-row">
          <span class="lbl">RSI</span>
          <div class="bar"><div class="fill" id="rsi" style="width:48%;background:#4488ff"></div></div>
          <span class="val" id="rsi-v">48</span>
        </div>
        <div class="ind-row">
          <span class="lbl">MACD</span>
          <div class="bar"><div class="fill" id="macd" style="width:35%;background:#4488ff"></div></div>
          <span class="val" id="macd-v">-3</span>
        </div>
        <div class="ind-row">
          <span class="lbl">Vol</span>
          <div class="bar"><div class="fill" id="vol" style="width:20%;background:#444"></div></div>
          <span class="val" id="vol-v">低</span>
        </div>
      </div>
      <div class="composite">
        <span class="icon">◎</span>
        <div class="bar"><div class="fill" id="comp-fill" style="width:18%;background:#444"></div></div>
        <span class="pct" id="comp-pct">18%</span>
      </div>
      <div class="tp-progress" id="tp-prog">
        <span class="lbl">TP進捗</span>
        <div class="bar"><div class="fill" id="tp-prog-fill" style="width:0%"></div></div>
      </div>
    </div>
  </div>

  <!-- Bot Switcher (scrollable) -->
  <div class="bot-switcher" id="bot-switcher">
    <button onclick="switchBot('none')">ノーポジ</button>
    <button onclick="switchBot('sarah')" class="active" data-bot="sarah">SARAH🟢</button>
    <button onclick="switchBot('emma')" data-bot="emma">EMMA🔴</button>
    <button onclick="switchBot('john')" data-bot="john">JOHN🔵</button>
    <button onclick="switchBot('mike')" data-bot="mike">MIKE🟣</button>
    <button onclick="switchBot('alex')" data-bot="alex">ALEX🟡</button>
    <button onclick="switchBot('yuki')" data-bot="yuki">YUKI⚪</button>
    <button onclick="switchBot('delta')" data-bot="delta">DELTA🔶</button>
    <button onclick="switchBot('atr')" data-bot="atr">ATR🔷</button>
  </div>

  <!-- Overlay -->
  <div class="overlay" id="overlay">
    <div class="bg" id="overlay-bg"></div>
    <div class="content">
      <div class="result-icon" id="res-icon"></div>
      <div class="result-title" id="res-title"></div>
      <div class="result-char" id="res-char">
        <img id="res-img" src="" />
      </div>
      <div class="result-name" id="res-name"></div>
      <div class="result-pnl" id="res-pnl"></div>
    </div>
  </div>

  <!-- Debug State Switcher -->
  <div class="debug-bar">
    <button onclick="setState('idle')" class="active" id="btn-idle">S1 凪</button>
    <button onclick="setState('omen')" id="btn-omen">S2 気配</button>
    <button onclick="setState('rising')" id="btn-rising">S3 胎動</button>
    <button onclick="setState('clash')" id="btn-clash">S4 激突</button>
    <button onclick="setState('hot')" id="btn-hot">S5 激アツ</button>
    <button onclick="setState('awaken')" id="btn-awaken">S6 覚醒</button>
    <button onclick="setState('critical')" id="btn-critical">S7 臨界</button>
    <button onclick="setState('fizzle')" id="btn-fizzle">S8 尻すぼみ</button>
  </div>

<script>
// ==============================
// Bot Data — 尾獣メカニクス5段階画像対応
// ==============================
// 画像ファイル名規則: assets/images/{id}_{phase}.png
// phase: idle(S1-S2), battle(S3-S4), hot(S5), awaken(S6-S7), fizzle(S8)
const bots = {
  sarah: {
    name: 'SARAH 🟢', color: '#22cc88', glow: 'rgba(34,204,136,0.3)',
    fallback: '🟢', beast: '鳳凰',
    images: {
      idle:   'assets/images/sarah_idle.png',
      battle: 'assets/images/sarah_battle.png',
      hot:    'assets/images/sarah_hot.png',
      awaken: 'assets/images/sarah_awaken.png',
      fizzle: 'assets/images/sarah_fizzle.png',
      base:   'assets/images/sarah.png',  // fallback single image
    },
  },
  emma: {
    name: 'EMMA 🔴', color: '#ff2244', glow: 'rgba(255,34,68,0.3)',
    fallback: '🔴', beast: '狂牛',
    images: {
      idle:   'assets/images/emma_idle.png',

// ==============================
// Get best available image for bot + state
// ==============================
function getBotImage(botId, gameState) {
  const bot = bots[botId];
  if (!bot) return '';
  const phase = stateToPhase[gameState] || 'idle';
  const imgs = bot.images;
  // Try phase-specific, then base, then empty
  return imgs[phase] || imgs.base || '';
}

// ==============================
// Update bot avatar image with fallback chain
// ==============================
function updateBotAvatar(botId, gameState) {
  const imgEl = document.getElementById('bot-img');
  const fbEl = document.getElementById('bot-fallback');
  const bot = bots[botId];
  if (!bot) return;

  const src = getBotImage(botId, gameState);
  if (src) {
    imgEl.src = src;
    imgEl.style.display = '';
    fbEl.style.display = 'none';
    // If phase image fails, try base; if base fails, show fallback
    imgEl.onerror = function() {
      const baseSrc = bot.images.base || '';
      if (this.src.indexOf(baseSrc) === -1 && baseSrc) {
        this.src = baseSrc;
      } else {
        this.style.display = 'none';
        fbEl.style.display = 'flex';
      }
    };
  } else {
    imgEl.style.display = 'none';
    fbEl.style.display = 'flex';
  }
  fbEl.textContent = bot.fallback;
}

// ==============================
// Switch Bot
// ==============================
function switchBot(id) {
  document.querySelectorAll('.bot-switcher button').forEach(b => b.classList.remove('active'));
  if (id === 'none') {
    document.querySelector('.bot-switcher button:first-child').classList.add('active');
    document.getElementById('bot-name').textContent = 'ノーポジ';
    document.getElementById('bot-emotion').textContent = '---';
    document.getElementById('bot-thought').textContent = 'Botを選択してください';
    document.getElementById('bot-img').style.display = 'none';
    document.getElementById('bot-fallback').style.display = 'flex';
    document.getElementById('bot-fallback').textContent = '—';
    document.documentElement.style.setProperty('--bot-color', '#666');
    document.documentElement.style.setProperty('--bot-glow', 'rgba(102,102,102,0.2)');
    return;
  }

  activeBot = id;
  const bot = bots[id];
  document.querySelector(`[data-bot="${id}"]`).classList.add('active');
  document.documentElement.style.setProperty('--bot-color', bot.color);
  document.documentElement.style.setProperty('--bot-glow', bot.glow);
  document.getElementById('bot-name').textContent = bot.name;
  updateBotAvatar(id, currentState);
  // Re-apply current state
  setState(currentState);
}

// ==============================
// Particles
// ==============================
function spawnParticles(color, count) {
  const container = document.getElementById('particles');
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.top = Math.random() * 100 + '%';
    p.style.background = color;
    p.style.width = (2 + Math.random() * 4) + 'px';
    p.style.height = p.style.width;
    p.style.opacity = '1';
    p.style.animation = `float-up ${1 + Math.random() * 2}s ease-out forwards`;
    p.style.animationDelay = Math.random() * 0.5 + 's';
    container.appendChild(p);
    setTimeout(() => p.remove(), 3000);
  }
}

// ==============================
// Set State
// ==============================
function setState(state) {
  currentState = state;
  const s = states[state];
  const bot = bots[activeBot];

  // Update bot avatar for current state (尾獣メカニクス)
  updateBotAvatar(activeBot, state);

  // Update beast overlay in chart area
  const beastOv = document.getElementById('beast-overlay');
  const beastImg = document.getElementById('beast-img');
  const phase = stateToPhase[state] || 'idle';
  beastOv.className = 'beast-overlay phase-' + phase;
  const beastSrc = getBotImage(activeBot, state);
  if (beastSrc && phase !== 'idle') {
    beastImg.src = beastSrc;
    beastImg.onerror = function() {
      const base = bot.images.base;
      if (base && this.src.indexOf(base) === -1) this.src = base;
      else beastOv.style.opacity = '0';
    };
  }

  // Debug buttons
  document.querySelectorAll('.debug-bar button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + state).classList.add('active');

  // Bot panel
  document.getElementById('bot-emotion').textContent = s.emotion;
  document.getElementById('bot-thought').textContent = s.thought;
  document.getElementById('comp-pct').textContent = s.comp + '%';
  document.getElementById('comp-fill').style.width = s.comp + '%';
  document.getElementById('comp-fill').style.background = s.compColor;

  // Indicators
  const indEl = document.getElementById('indicators');
  if (s.showInd) {
    indEl.style.display = '';
    if (s.rsi) {
      ['rsi','macd','vol'].forEach(k => {
        const d = s[k];
        document.getElementById(k).style.width = d[0] + '%';
        document.getElementById(k).style.background = d[1];
        document.getElementById(k + '-v').textContent = d[2];
      });
    }
  } else {
    indEl.style.display = 'none';
  }

  // Price
  document.getElementById('price').textContent = s.price;
  document.getElementById('change').textContent = s.change[0];
  document.getElementById('change').style.color = s.change[1];

  // Lines
  const showLines = s.lines === true;
  const showGhost = s.lines === 'ghost';
  document.getElementById('tp-line').style.opacity = showLines ? '1' : '0';
  document.getElementById('sl-line').style.opacity = showLines ? '1' : '0';
  document.getElementById('entry-line').style.opacity = (showLines || showGhost) ? '1' : '0';
  document.getElementById('zone-tp').style.opacity = showLines ? '1' : '0';
  document.getElementById('zone-sl').style.opacity = showLines ? '1' : '0';
  if (showGhost) {
    document.getElementById('entry-line').style.borderTopStyle = 'dashed';
    document.getElementById('entry-line').style.borderTopColor = 'rgba(255,215,0,0.4)';
  } else {
    document.getElementById('entry-line').style.borderTopStyle = 'dashed';
    document.getElementById('entry-line').style.borderTopColor = 'rgba(255,255,255,0.3)';
  }

  // PnL
  const pnlEl = document.getElementById('pnl-box');
  if (s.pnl) {
    pnlEl.textContent = s.pnl;
    pnlEl.style.opacity = '1';
    if (s.pnl.includes('-')) {
      pnlEl.style.color = '#ff2244';
      pnlEl.style.borderColor = 'rgba(255,34,68,0.3)';
    } else if (s.pnl.includes('+$0')) {
      pnlEl.style.color = '#888';
      pnlEl.style.borderColor = '#333';
    } else {
      pnlEl.style.color = '#ffd700';
      pnlEl.style.borderColor = 'rgba(255,215,0,0.3)';
    }
  } else {
    pnlEl.style.opacity = '0';
  }

  // Distance
  const distEl = document.getElementById('distance');
  if (s.distance) {
    distEl.textContent = s.distance;
    distEl.style.opacity = '1';
    distEl.style.color = typeof s.distColor === 'function' ? s.distColor() : s.distColor;
    distEl.style.top = s.distTop;
  } else {
    distEl.style.opacity = '0';
  }

  // State label
  const lblEl = document.getElementById('state-label');
  if (s.stateLabel) {
    lblEl.textContent = s.stateLabel;
    lblEl.style.color = s.stateLabelColor;
    lblEl.style.opacity = '1';
    setTimeout(() => { lblEl.style.opacity = '0'; }, 1500);
  } else {
    lblEl.style.opacity = '0';
  }

  // TP Progress
  const tpProgEl = document.getElementById('tp-prog');
  tpProgEl.style.opacity = s.showTpProg ? '1' : '0';
  document.getElementById('tp-prog-fill').style.width = s.tpProg + '%';

  // Edge glow
  const glowEl = document.getElementById('edge-glow');
  glowEl.className = 'edge-glow';
  if (s.glow) {
    glowEl.classList.add(s.glow);
    glowEl.style.opacity = '1';
  } else {
    glowEl.style.opacity = '0';
  }

  // Badge
  const badgeEl = document.getElementById('badge');
  if (s.badge) {
    badgeEl.textContent = s.badge;
    badgeEl.style.display = 'inline-block';
    if (state === 'awaken') {
      badgeEl.style.background = 'linear-gradient(90deg, #ff0088, #8800ff, #0088ff)';
      badgeEl.style.color = '#fff';
    } else {
      badgeEl.style.background = '#ffd700';
      badgeEl.style.color = '#000';
    }
  } else {
    badgeEl.style.display = 'none';
  }

  // Header bg
  document.getElementById('header').style.background = s.headerBg || 'linear-gradient(180deg, #0f1530, #0a0a1a)';

  // Shake
  const chartEl = document.getElementById('chart-area');
  if (s.shake) {
    chartEl.style.animation = 'shake 0.4s ease 2';
    setTimeout(() => { chartEl.style.animation = ''; }, 1000);
  }

  // Particles
  if (state === 'hot') spawnParticles('#ffd700', 20);
  if (state === 'awaken') spawnParticles('#ffffff', 30);
  if (state === 'critical') spawnParticles('#ffd700', 40);
  if (state === 'clash') spawnParticles(bot.color, 15);

  // Overlay
  const ovEl = document.getElementById('overlay');
  if (s.overlay) {
    document.getElementById('res-icon').textContent = s.overlay.icon;
    document.getElementById('res-title').textContent = s.overlay.title;
    document.getElementById('res-title').style.color = s.overlay.pnlColor;
    document.getElementById('res-name').textContent = bot.name;
    document.getElementById('res-pnl').textContent = s.overlay.pnl;
    document.getElementById('res-pnl').style.color = s.overlay.pnlColor;
    document.getElementById('overlay-bg').style.background = s.overlay.bg;
    document.getElementById('res-img').src = getBotImage(activeBot, state);
    document.getElementById('res-img').onerror = function() {
      const base = bot.images.base;
      if (base && this.src.indexOf(base) === -1) this.src = base;
    };
    ovEl.style.opacity = '1';
  } else {
    ovEl.style.opacity = '0';
  }
}
